<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conversor Numérico</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      padding: 30px;
    }
    .contenedor {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      margin-bottom: 20px;
    }
    .caja-resultado {
      background: #e9ecef;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
    }
    p {
      margin: 5px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h2>Conversor de Bases</h2>

    <label for="numero">Ingresa número decimal:</label>
    <input type="number" id="numero" placeholder="Ejemplo: 255">

    <button onclick="convertir()">Convertir</button>

    <div class="caja-resultado">
      <p>Binario: <span id="resBinario">-</span></p>
    </div>

    <div class="caja-resultado">
      <p>Octal: <span id="resOctal">-</span></p>
    </div>

    <div class="caja-resultado">
      <p>Hexadecimal: <span id="resHex">-</span></p>
    </div>
  </div>

  <script>
    function convertir() {
      let valorInput = document.getElementById("numero").value;
      let decimal = parseInt(valorInput);

      if (isNaN(decimal)) {
        alert("Por favor, ingresa un número válido");
        return;
      }

      document.getElementById("resBinario").textContent = decimal.toString(2);
      document.getElementById("resOctal").textContent = decimal.toString(8);
      document.getElementById("resHex").textContent = decimal.toString(16).toUpperCase();
    }
  </script>

</body>
</html>
